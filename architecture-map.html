<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=4" />
<title>PM CLI — Architecture Map</title>
<style>
  :root{
    --bg:#0F0F0F; --panel:#161616; --panel-2:#1c1c1c; --border:#2a2a2a;
    --text:#e8e8e8; --muted:#8a8a8a;
    --client:#4ea1ff; --route:#7bd389; --service:#c792ea; --db:#ffb86b;
    --external:#ff6b9d; --critical:#ff3860; --accent:#f5b942; --accent-2:#ff7a45;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  #app{display:grid;grid-template-columns:1fr 360px;grid-template-rows:auto 1fr;height:100vh;width:100vw}
  header{grid-column:1 / -1;background:var(--panel);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  header h1{font-size:15px;margin:0;font-weight:650;letter-spacing:.2px}
  header .sub{color:var(--muted);font-size:12px;margin-left:2px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
  .chip{background:var(--panel-2);border:1px solid var(--border);color:var(--muted);
    padding:4px 10px;border-radius:14px;cursor:pointer;font-size:12px;user-select:none;white-space:nowrap}
  .chip:hover{color:var(--text);border-color:#3a3a3a}
  .chip.active{background:var(--accent);color:#1a1a1a;border-color:var(--accent);font-weight:600}
  .canvas-wrap{position:relative;overflow:hidden;background:
    radial-gradient(circle at 20% 10%, #141414 0%, var(--bg) 60%);min-height:0}
  svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  svg.grabbing{cursor:grabbing}
  .cluster-box{fill-opacity:.10;stroke-opacity:.5;stroke-width:1}
  .cluster-label{fill:var(--muted);font-size:12px;font-weight:600;letter-spacing:.4px;text-transform:uppercase}
  .node-rect{cursor:pointer;transition:opacity .15s}
  .node-label{font-size:12px;font-weight:600;pointer-events:none;fill:var(--text)}
  .node-sub{font-size:10px;pointer-events:none;fill:var(--muted)}
  .edge-path{fill:none;stroke-width:1.4;opacity:.55;transition:opacity .15s}
  .edge-label{font-size:9.5px;fill:var(--muted);pointer-events:none;opacity:.9}
  .dim{opacity:.12 !important}
  .edge-dim{opacity:.05 !important}
  .badge-circle{stroke:#0f0f0f;stroke-width:1}
  .badge-text{font-size:9px;font-weight:700;fill:#0f0f0f;pointer-events:none;text-anchor:middle}
  aside{grid-row:2;grid-column:2;background:var(--panel);border-left:1px solid var(--border);
    padding:16px;overflow-y:auto}
  aside h2{font-size:14px;margin:0 0 4px}
  aside .tag{display:inline-block;font-size:10px;color:var(--muted);border:1px solid var(--border);
    border-radius:4px;padding:1px 6px;margin:2px 4px 2px 0}
  aside .role{color:var(--text);margin:8px 0 2px;font-size:13px}
  aside .plain{color:#c9c9c9;background:var(--panel-2);border-radius:8px;padding:10px 12px;margin:8px 0;font-size:13px;border:1px solid var(--border)}
  aside .path{color:var(--accent);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;word-break:break-all;margin:6px 0}
  aside h3{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:16px 0 6px}
  aside ul{margin:4px 0;padding-left:16px}
  aside li{margin:3px 0;font-size:12.5px;color:#cfcfcf}
  aside .edge-in{color:var(--route)} aside .edge-out{color:var(--accent-2)}
  .legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;font-size:11px;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .legend i{width:16px;height:3px;border-radius:2px;display:inline-block}
  .ctrls{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px;z-index:5}
  .ctrls button{width:34px;height:34px;border-radius:8px;background:var(--panel-2);
    border:1px solid var(--border);color:var(--text);font-size:16px;cursor:pointer}
  .ctrls button:hover{border-color:#3a3a3a}
  .ctrls button.fit{font-size:11px}
  .findings li{margin:6px 0}
  .sev-high{color:#ff6b6b} .sev-med{color:var(--db)} .sev-low{color:var(--muted)}
  @media (max-width:900px){
    #app{grid-template-columns:1fr;grid-template-rows:auto minmax(320px,52vh) auto}
    header{grid-column:1}
    .canvas-wrap{grid-column:1;grid-row:2;min-height:320px}
    aside{grid-column:1;grid-row:3;border-left:none;border-top:1px solid var(--border);max-height:48vh}
    .chips{width:100%;margin-left:0}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <h1>Property Meld CLI — Architecture Map</h1>
      <div class="sub">cli-anything-pm · dual-auth HTTP adapter for the Property Meld work-order system</div>
    </div>
    <div class="chips" id="chips"></div>
  </header>

  <div class="canvas-wrap">
    <svg id="svg">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#6a6a6a"/>
        </marker>
        <marker id="arrow-crit" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="var(--critical)"/>
        </marker>
        <marker id="arrow-api" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="var(--accent-2)"/>
        </marker>
      </defs>
      <g id="viewport">
        <g id="clusters"></g>
        <g id="edges"></g>
        <g id="edgelabels"></g>
        <g id="nodes"></g>
      </g>
    </svg>
    <div class="ctrls">
      <button class="fit" id="fit" title="Fit to view">Fit</button>
      <button id="zin" title="Zoom in">+</button>
      <button id="zout" title="Zoom out">&minus;</button>
    </div>
  </div>

  <aside id="sidebar"></aside>
</div>

<script>

/* edges */
function edgePath(a,b){
  const x1=a.x+a.w, y1=a.y+a.h/2, x2=b.x, y2=b.y+b.h/2;
  if(b.x < a.x+a.w){ // back/internal edge — exit bottom, enter top-ish
    const sx=a.x+a.w/2, sy=a.y+a.h, ex=b.x+b.w/2, ey=b.y;
    const mid=(sy+ey)/2;
    return {d:`M ${sx} ${sy} C ${sx} ${mid}, ${ex} ${mid}, ${ex} ${ey}`, lx:(sx+ex)/2, ly:mid};
  }
  const dx=Math.max(60,(x2-x1)*0.5);
  return {d:`M ${x1} ${y1} C ${x1+dx} ${y1}, ${x2-dx} ${y2}, ${x2} ${y2}`, lx:(x1+x2)/2, ly:(y1+y2)/2-6};
}
const edgeEls=[];
edges.forEach((e,i)=>{
  const a=nodeById[e.from], b=nodeById[e.to];
  if(!a||!b)return;
  const {d,lx,ly}=edgePath(a,b);
  const p=mk('path',{d,class:'edge-path',stroke:edgeColor[e.kind]||'#6a6a6a','marker-end':`url(#${edgeMarker[e.kind]||'arrow'})`});
  if(e.kind==='critical')p.style.strokeWidth='2.4';
  gE.appendChild(p);
  const stagger=(i%3-1)*10;
  const t=mk('text',{x:lx,y:ly+stagger,class:'edge-label','text-anchor':'middle'});
  t.textContent=e.label;
  gL.appendChild(t);
  edgeEls.push({e,p,t});
});

  const bugs=(KNOWN_BUGS[n.id]||[]).length, fixes=(FIXES[n.id]||[]).length;

  if(bugs){g.appendChild(mk('circle',{cx:bx,cy:n.y+14,r:8,class:'badge-circle',fill:'var(--critical)'}));

  if(fixes){g.appendChild(mk('circle',{cx:bx,cy:n.y+14,r:8,class:'badge-circle',fill:'var(--route)'}));
    const ft=mk('text',{x:bx,y:n.y+17.5,class:'badge-text'});ft.textContent=fixes;g.appendChild(ft);}
  g.style.cursor='pointer';
  g.addEventListener('click',ev=>{ev.stopPropagation();select(n.id);});
  g.addEventListener('mouseenter',()=>{if(!selected)highlight(n.id);});
  g.addEventListener('mouseleave',()=>{if(!selected)clearHighlight();});
  gN.appendChild(g);
  nodeEls.push({n,g,rect});

/* filtering */
function applyFilter(){
  nodeEls.forEach(({n,g})=>{
    const vis=n.tag.includes(activeFilter)||activeFilter==='all';
    g.classList.toggle('dim',!vis);
  });
  edgeEls.forEach(({e,p,t})=>{
    const vis=e.tag.includes(activeFilter)||activeFilter==='all';
    p.classList.toggle('edge-dim',!vis);
    t.style.opacity=vis?0.9:0.05;
  });
}
function highlight(id){
  const conn=new Set([id]);
  edges.forEach(e=>{if(e.from===id)conn.add(e.to);if(e.to===id)conn.add(e.from);});
  nodeEls.forEach(({n,g})=>g.classList.toggle('dim',!conn.has(n.id)));
  edgeEls.forEach(({e,p,t})=>{const on=e.from===id||e.to===id;p.classList.toggle('edge-dim',!on);t.style.opacity=on?1:0.05;});
}
function clearHighlight(){applyFilter();}

function select(id){selected=id;highlight(id);renderSidebar(id);}
svg.addEventListener('click',()=>{selected=null;applyFilter();renderSidebar(null);});

    <div class="path">${n.path}</div>
    ${n.notes?`<h3>Notes</h3><ul>${n.notes.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}
    ${bugs.length?`<h3>Known issues</h3><ul>${bugs.map(b=>`<li class="sev-${b.sev}"><b>[${b.sev}]</b> ${b.t} ${b.ref?`<span style="color:var(--muted)">(${b.ref})</span>`:''}</li>`).join('')}</ul>`:''}
    ${fixes.length?`<h3>Fixes</h3><ul>${fixes.map(f=>`<li>${f.t}</li>`).join('')}</ul>`:''}
    <h3>Incoming</h3><ul>${ins.length?ins.map(e=>`<li class="edge-in">${nodeById[e.from].label} — ${e.label}</li>`).join(''):'<li style="color:var(--muted)">none</li>'}</ul>
    <h3>Outgoing</h3><ul>${outs.length?outs.map(e=>`<li class="edge-out">${e.label} → ${nodeById[e.to].label}</li>`).join(''):'<li style="color:var(--muted)">none</li>'}</ul>`;
}

/* chips */
const chipWrap=document.getElementById('chips');
CHIPS.forEach(c=>{
  const el=document.createElement('div');
  el.className='chip'+(c.id===activeFilter?' active':'');
  el.textContent=c.label;
  el.addEventListener('click',()=>{
    activeFilter=c.id;selected=null;
    [...chipWrap.children].forEach(x=>x.classList.remove('active'));
    el.classList.add('active');
    applyFilter();renderSidebar(null);
  });
  chipWrap.appendChild(el);
});

/* pan + zoom */
let tx=0,ty=0,scale=1;
function applyTransform(){vp.setAttribute('transform',`translate(${tx},${ty}) scale(${scale})`);}
function fit(){
  const pad=60;
  const minX=Math.min(...clusters.map(c=>c.x))-pad;
  const minY=Math.min(...clusters.map(c=>c.y))-pad;
  const maxX=Math.max(...clusters.map(c=>c.x+c.w))+pad;
  const maxY=Math.max(...clusters.map(c=>c.y+c.h))+pad;
  const bw=maxX-minX, bh=maxY-minY;
  const r=svg.getBoundingClientRect();
  const w=r.width||window.innerWidth, h=r.height||600;
  scale=Math.min(w/bw,h/bh);
  tx=(w-bw*scale)/2-minX*scale;
  ty=(h-bh*scale)/2-minY*scale;
  applyTransform();
}
document.getElementById('fit').addEventListener('click',fit);
document.getElementById('zin').addEventListener('click',()=>{scale*=1.2;applyTransform();});
document.getElementById('zout').addEventListener('click',()=>{scale/=1.2;applyTransform();});
let dragging=false,sx=0,sy=0;
svg.addEventListener('mousedown',e=>{dragging=true;sx=e.clientX-tx;sy=e.clientY-ty;svg.classList.add('grabbing');});
window.addEventListener('mousemove',e=>{if(dragging){tx=e.clientX-sx;ty=e.clientY-sy;applyTransform();}});
window.addEventListener('mouseup',()=>{dragging=false;svg.classList.remove('grabbing');});
svg.addEventListener('wheel',e=>{
  e.preventDefault();
  const r=svg.getBoundingClientRect();
  const mx=e.clientX-r.left, my=e.clientY-r.top;
  const f=e.deltaY<0?1.12:1/1.12;
  const ns=scale*f;
  tx=mx-(mx-tx)*f; ty=my-(my-ty)*f; scale=ns;
  applyTransform();
},{passive:false});
// touch pan
let tStart=null;
svg.addEventListener('touchstart',e=>{if(e.touches.length===1){tStart={x:e.touches[0].clientX-tx,y:e.touches[0].clientY-ty};}},{passive:true});
svg.addEventListener('touchmove',e=>{if(e.touches.length===1&&tStart){tx=e.touches[0].clientX-tStart.x;ty=e.touches[0].clientY-tStart.y;applyTransform();}},{passive:true});

applyFilter();
renderSidebar(null);
window.addEventListener('resize',fit);
// fit after layout settles (mobile grid needs a tick)
requestAnimationFrame(()=>requestAnimationFrame(fit));
setTimeout(fit,150);
</script>
</body>
