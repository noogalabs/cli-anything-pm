name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**', 'ci/**', 'docs/**']
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest setuptools wheel

      - name: Run tests (pytest -x)
        env:
          PROPERTYMELD_VOCAB_SALT: ${{ secrets.PROPERTYMELD_VOCAB_SALT }}
        run: pytest tests/ -x
