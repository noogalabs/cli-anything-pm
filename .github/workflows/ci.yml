name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**', 'ci/**', 'docs/**']
  pull_request:
    branches: [main]

jobs:
  # A push to a branch that already has an open PR is covered by that PR's
  # `pull_request` run, so running the push copy too costs a full duplicate CI
  # for every fold. Ported from ascendops-live PR350 (piper, 2026-09-04) after
  # the privacy-rewrite push billed two runs on main and the ci.yml here was
  # found to carry no gate at all. Actions minutes are paid spend against the
  # org's monthly cap, so a duplicate run is real money, not just noise.
  #
  # The branch is queried by NAME, not by head SHA: on a push the PR's head may
  # not have advanced yet, and a SHA query would race. If the query fails or
  # returns nothing the gate OPENS, so the failure direction is a redundant run,
  # never a skipped one. Pushes with no open PR (including main) still run, and
  # workflow_dispatch is never gated -- the rewrite runbook depends on a manual
  # dispatch always executing.
  gate:
    name: Duplicate-run gate
    runs-on: ubuntu-latest
    # Scoped to THIS job on purpose: a workflow-level permissions block replaces
    # the default GITHUB_TOKEN scope for EVERY job, and only the gate needs to
    # read PRs.
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 2
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "not a push event; running"
            exit 0
          fi
          open=$(gh api \
            "repos/${{ github.repository }}/pulls?state=open&head=${{ github.repository_owner }}:${{ github.ref_name }}" \
            --jq 'length' 2>/dev/null || echo "")
          if [ "$open" = "" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "PR lookup failed; running rather than skipping"
          elif [ "$open" = "0" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "no open PR for ${{ github.ref_name }}; running"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "${{ github.ref_name }} has $open open PR(s); the pull_request run covers this commit"
          fi

  build-test:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest setuptools wheel

      - name: Run tests (pytest -x)
        env:
          PROPERTYMELD_VOCAB_SALT: ${{ secrets.PROPERTYMELD_VOCAB_SALT }}
        run: pytest tests/ -x
